version: 2

models:
  - name: dim_location
    description: "Location dimension: TLC taxi zones enriched with borough, zone name, and service zone. Referenced by fct_trips pickup/dropoff location ids."
    columns:
      - name: location_id
        description: "TLC taxi zone id (primary key)."
        tests: [not_null, unique]
      - name: borough
        description: "NYC borough the zone belongs to."

  - name: dim_payment
    description: "Payment dimension: payment_type code with its human-readable description."
    columns:
      - name: payment_type
        description: "Payment type code (primary key)."
        tests: [not_null, unique]
      - name: payment_desc
        description: "Human-readable payment method (e.g. Credit card, Cash)."

  - name: dim_ratecode
    description: "Rate code dimension: RatecodeID with its human-readable description."
    columns:
      - name: ratecode_id
        description: "Rate code id (primary key)."
        tests: [not_null, unique]
      - name: ratecode_desc
        description: "Human-readable rate code (e.g. Standard rate, JFK)."

  - name: dim_datetime
    description: "Date dimension at day grain, built from the pickup dates present in the data. Referenced by fct_trips.pickup_date."
    columns:
      - name: date_key
        description: "Calendar date (primary key); matches fct_trips.pickup_date."
        tests: [not_null, unique]
      - name: is_weekend
        description: "True for Saturday/Sunday."

  - name: fct_trips
    description: "Trip fact table at one-row-per-trip grain. Partitioned by pickup_date and clustered by pickup_location_id for scan efficiency. Measures use their full column names: fare_amount, tip_amount, tolls_amount, total_amount, trip_distance, trip_duration_min, passenger_count."
    columns:
      - name: trip_key
        description: "Deterministic surrogate key from staging (primary key)."
        tests: [not_null, unique]
      - name: pickup_date
        description: "Partition key; joins dim_datetime.date_key."
        tests:
          - not_null
          - relationships:
              to: ref('dim_datetime')
              field: date_key
      - name: pickup_location_id
        description: "Cluster key; joins dim_location.location_id."
        tests:
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: payment_type
        description: "Joins dim_payment.payment_type."
        tests:
          - relationships:
              to: ref('dim_payment')
              field: payment_type
      - name: ratecode_id
        description: "Joins dim_ratecode.ratecode_id."
      # Measures and remaining keys carry no dbt tests, but they are what users
      # actually ask about. They are documented here because this file is the
      # schema context the RAG retriever feeds to the NL2SQL model — an
      # undocumented column is one the model has to guess the name of.
      - name: dropoff_location_id
        description: "Drop-off zone; joins dim_location.location_id."
      - name: pickup_datetime
        description: "Trip start timestamp."
      - name: dropoff_datetime
        description: "Trip end timestamp."
      - name: trip_duration_min
        description: "Trip duration in minutes."
      - name: passenger_count
        description: "Number of passengers."
      - name: trip_distance
        description: "Trip distance in miles."
      - name: fare_amount
        description: "Base fare in USD, excluding tip, tolls and surcharges."
      - name: tip_amount
        description: "Tip in USD. Card payments only — cash tips are not recorded."
      - name: tolls_amount
        description: "Tolls in USD."
      - name: total_amount
        description: "Total charged in USD, including fare, tip, tolls and surcharges."
