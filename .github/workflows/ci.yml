name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default. Jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ruff
      # `ruff format` is deliberately not a gate — see the Faza 7 design doc.
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # pytest.ini sets `-m "not integration"`, so GCP-touching tests are
      # excluded. No GOOGLE_* env vars here on purpose: if an unmarked test
      # reaches for BigQuery, this job should fail and the marker gets added.
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12, not the project's 3.14: dbt-bigquery declares support only up
          # to 3.13, and this matches dbt/Dockerfile — the environment where dbt
          # is actually exercised. dbt is a vendored tool here, not project code.
          python-version: "3.12"
          cache: pip
      - run: pip install "dbt-bigquery>=1.8,<2.0"
      # `dbt parse` validates model SQL, ref()/source() wiring and the schema
      # YAML without opening a BigQuery connection, so no credentials needed.
      # DBT_PROFILES_DIR is explicit rather than relying on dbt's project-dir
      # fallback — dbt/Dockerfile sets it too, and a clean runner has no
      # ~/.dbt/profiles.yml to fall back to.
      - run: dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
      - run: dbt parse
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later reverted is
          # still leaked, and a shallow clone would not see it.
          fetch-depth: 0
      # The official image in a plain step, not gitleaks-action: the action
      # requires a paid GITLEAKS_LICENSE for anything but a public personal
      # repo (this one is private), and running the scanner directly keeps a
      # third-party action away from GITHUB_TOKEN. Pinned, not :latest, so a
      # new upstream release cannot change what this gate does.
      - name: Scan full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose
